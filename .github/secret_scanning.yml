# The e2e fixtures below print FAKE Anthropic tokens. They are shaped like real ones on
# purpose: they have to match the app's own capture pattern (`TOKEN_RE`,
# src/main/index.ts) and they have to be ~108 characters, because a real long-lived
# token is that long and WRAPS in an 80-column pty — the truncated-capture bug those
# fixtures exist to catch. Shortening them or changing the prefix would delete what they
# test, so the paths are excluded from secret scanning here instead.
#
# This suppresses ALERTS. Push protection is a separate control: if it ever stops a push
# that touches one of these lines, bypass it with "used in tests".
paths-ignore:
  - 'test/e2e/fixtures/**'
  - 'test/e2e/multi-account.spec.ts'
