name: Website

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'build/icon.svg'
      - 'scripts/site-changelog.mjs'
      - '.github/workflows/pages.yml'
  # A release in superkoh/koloft-releases fires no event here. The release procedure runs
  # `gh workflow run pages.yml` after it publishes; the daily timer catches a release that
  # skipped that step.
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - run: cp build/icon.svg site/

      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp 'repos/superkoh/koloft-releases/releases?per_page=100' > "$RUNNER_TEMP/releases.json"
          node scripts/site-changelog.mjs "$RUNNER_TEMP/releases.json" site/changelog/index.html

      - id: pages
        uses: actions/configure-pages@v6

      # Absolute links (canonical, og:image, sitemap) carry __SITE_URL__, so they follow
      # the custom domain once one is set in the repo's Pages settings. Forced to https:
      # koloft.ai sits behind Cloudflare's proxy, so GitHub issues it no certificate and
      # base_url says http, while visitors reach the site over https through Cloudflare.
      - env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          SITE_URL="https://${BASE_URL#*://}"
          find site -type f \( -name '*.html' -o -name 'sitemap.xml' -o -name 'robots.txt' \) -print0 \
            | xargs -0 sed -i "s|__SITE_URL__|${SITE_URL%/}|g"
          ! grep -rIl __SITE_URL__ site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5
