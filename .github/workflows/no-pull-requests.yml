name: Pull requests are not open yet

# Koloft is published to be read and run, and to take bug reports and ideas as issues.
# It does not take outside code contributions yet. GitHub has no switch for that, so this
# closes any pull request that comes from a fork, with a note saying where to go. A branch
# in this repository can only be pushed by someone with write access, so their pull
# requests stay open.
on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  close:
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - run: |
          gh pr comment "$PR" --repo "$REPO" --body "Thanks for taking the time. Koloft is not taking pull requests yet — the code is here to be read and run, and bug reports and ideas are very welcome as issues. This will change; when it does, CONTRIBUTING.md will say so. Closing for now."
          gh pr close "$PR" --repo "$REPO"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
