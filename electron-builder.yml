# reverse-DNS of koloft.ai (the product domain)
appId: ai.koloft.app
productName: Koloft
copyright: Copyright © 2026 koh

directories:
  output: release
  buildResources: build

# Allow-list: only the built app gets packed. package.json is always included, and
# production node_modules (node-pty, ccstatusline) are collected by electron-builder's
# dependency walker independent of these globs. The previous deny-list swept the whole
# repo into the asar — including .claude/worktrees/* and their node_modules, which is
# what ballooned the dmg from ~120 MB (0.5.0) to ~385 MB (0.5.1+).
files:
  - out/**

# Chromium UI locales shipped inside Electron Framework — 220 .lproj folders, ~48 MB.
# Koloft's own UI is English; these strings only surface in Chromium-internal chrome
# (PDF viewer, spellcheck menus, the embedded-browser bits). A missing locale falls
# back to en, so keep just en + zh_CN.
electronLanguages:
  - en
  - zh_CN

# Downloads the pinned gh (GitHub CLI), git and Git Credential Manager into vendor/,
# checksum-checked, so a new Mac has them without installing anything
# (scripts/vendor-release.json pins them).
beforePack: scripts/fetch-vendor.cjs

extraResources:
  - from: vendor/gh
    to: gh
  - from: vendor/git
    to: git
  - from: vendor/gcm
    to: gcm

# Runs after the app is assembled and before it is signed, so the signature covers the
# stripped native binaries.
afterPack: scripts/strip-native-build-paths.cjs

asarUnpack:
  - '**/node_modules/node-pty/**'
  # executed by an external bash wrapper (src/main/statusline.ts) via
  # ELECTRON_RUN_AS_NODE — must exist as real files, not asar entries
  - '**/node_modules/ccstatusline/**'
  # run the same way by the playwright-cli wrapper (src/main/playwrightCli.ts); the
  # packager hoists its own playwright and playwright-core to the top of node_modules,
  # and the CLI's require of them fails unless they sit unpacked beside it
  - '**/node_modules/@playwright/cli/**'
  - '**/node_modules/playwright/**'
  - '**/node_modules/playwright-core/**'
  # run the same way for `koloft phone` (src/main/phone/android.ts), and its helper apps
  # are pushed to the Android emulator as real files
  - '**/node_modules/agent-device/**'

mac:
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  category: public.app-category.developer-tools
  icon: build/icon.icns
  # `dist:dmg` signs with the Developer ID identity in the login keychain and refuses to
  # build without one; `dist:mac` and `dist:beta` stay unsigned. Hardened runtime is
  # electron-builder's default. camera + audio-input: a Workbench web page can ask for
  # the mic or camera, and these let the hardened runtime grant them.
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  artifactName: ${productName}-${version}-${arch}.${ext}

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}

# Releases are cut by hand: `scripts/release-notes.sh` composes the notes and
# `gh release create` uploads the dmg. electron-builder must never do it. Without this,
# `repository` in package.json is enough for it to infer a GitHub target, and its
# implicit publishing switches itself on when it detects CI — so the day packaging moves
# into a workflow, a build would start publishing releases on its own.
publish: null
